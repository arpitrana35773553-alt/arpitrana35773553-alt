<svg width="850" height="200" viewBox="0 0 850 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#150f28"/>
    </linearGradient>
    <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#fff;#38bdf8;#a855f7;#fff" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#fff;#38bdf8" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#fff;#38bdf8;#a855f7" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".04"/>
    </pattern>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <clipPath id="topClip"><rect width="850" height="3" rx="0"/></clipPath>
  </defs>

  <!-- BG -->
  <rect width="850" height="200" rx="20" fill="url(#bg)"/>
  <rect width="850" height="200" rx="20" fill="url(#dots)"/>

  <!-- Ambient blobs -->
  <ellipse cx="-20" cy="-20" rx="160" ry="160" fill="url(#b1)">
    <animate attributeName="opacity" values=".3;.8;.3" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="900" cy="220" rx="190" ry="190" fill="url(#b2)">
    <animate attributeName="opacity" values=".4;.9;.4" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Border -->
  <rect width="850" height="200" rx="20" fill="none" stroke="#6366f1" stroke-opacity=".35" stroke-width="1"/>

  <!-- Animated top gradient line -->
  <g clip-path="url(#topClip)">
    <rect width="1700" height="3" fill="url(#topLine)">
      <animateTransform attributeName="transform" type="translate" values="0,0;-850,0;0,0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Hello World badge -->
  <rect x="28" y="22" width="148" height="26" rx="13" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".45" stroke-width="1"/>
  <text x="42" y="39" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing=".5">👋  HELLO WORLD!</text>

  <!-- Name -->
  <text x="28" y="96" font-family="'Segoe UI',system-ui,sans-serif" font-size="40" font-weight="800" fill="url(#nameG)">Arpit Rana</text>

  <!-- Prompt symbol -->
  <text x="28" y="130" font-family="monospace" font-size="14" font-weight="700" fill="#38bdf8">❯</text>

  <!-- Cycling role text -->
  <text x="48" y="130" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="500">
    AI &amp; Cybersecurity Enthusiast
    <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;.30;.33;.34;.63;.97;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="48" y="130" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="500" opacity="0">
    B.Tech CSE Core Student @ LPU
    <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;.30;.34;.37;.63;.66;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="48" y="130" font-family="monospace" font-size="14" fill="#e2e8f0" font-weight="500" opacity="0">
    Builder · Explorer · Problem Solver
    <animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;.30;.34;.63;.67;.70;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- Cursor blink -->
  <rect x="352" y="116" width="7" height="16" rx="2" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- RIGHT: Available pill -->
  <rect x="556" y="42" width="268" height="30" rx="15" fill="#10b981" fill-opacity=".1" stroke="#10b981" stroke-opacity=".4" stroke-width="1"/>
  <circle cx="574" cy="57" r="5" fill="#10b981" filter="url(#glow)">
    <animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".6;1;.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="585" y="62" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="600" fill="#34d399">Available for Collaborations</text>

  <!-- Cyber badge -->
  <rect x="556" y="83" width="268" height="28" rx="12" fill="#6366f1" fill-opacity=".12" stroke="#6366f1" stroke-opacity=".35" stroke-width="1"/>
  <text x="690" y="101" font-family="monospace" font-size="12" fill="#c7d2fe" text-anchor="middle">🛡️ SecOps  //  🤖 Neural Core</text>

  <!-- Chip row -->
  <rect x="556" y="122" width="76" height="24" rx="9" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-opacity=".32" stroke-width="1"/>
  <text x="594" y="138" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ AI/ML</text>

  <rect x="640" y="122" width="82" height="24" rx="9" fill="#a855f7" fill-opacity=".08" stroke="#a855f7" stroke-opacity=".32" stroke-width="1"/>
  <text x="681" y="138" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">🔒 CyberSec</text>

  <rect x="730" y="122" width="94" height="24" rx="9" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".1" stroke-width="1"/>
  <text x="777" y="138" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">🎓 LPU CSE</text>
</svg>
