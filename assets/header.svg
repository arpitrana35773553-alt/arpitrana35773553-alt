<svg width="850" height="210" viewBox="0 0 850 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&amp;family=Fira+Code:wght@600&amp;display=swap');
      
      .f-cond-hero {
        font-family: 'Barlow Condensed', 'Arial Narrow', -apple-system-condensed, sans-serif-condensed, sans-serif;
        font-size: 52px;
        font-weight: 900;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .f-cond-tag {
        font-family: 'Barlow Condensed', 'Arial Narrow', -apple-system-condensed, sans-serif-condensed, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      .f-cond-sub {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 13px;
        font-weight: 600;
      }
      .f-cond-chip {
        font-family: 'Barlow Condensed', 'Arial Narrow', -apple-system-condensed, sans-serif-condensed, sans-serif;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
    </style>

    <linearGradient id="h-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#090f21"/>
      <stop offset="100%" stop-color="#120b24"/>
    </linearGradient>

    <linearGradient id="neon-name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#38bdf8;#9d4edd;#f72585;#00f2fe" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#9d4edd;#f72585;#00f2fe;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#f72585;#00f2fe;#38bdf8;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="laser-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f72585" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="h-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.06"/>
      <circle cx="24" cy="24" r="0.75" fill="#38bdf8" fill-opacity="0.12"/>
    </pattern>

    <clipPath id="h-clip">
      <rect width="850" height="210" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#h-clip)">
    <!-- Base Background -->
    <rect width="850" height="210" fill="url(#h-bg)"/>
    <rect width="850" height="210" fill="url(#h-grid)"/>

    <!-- Ambient Blobs -->
    <circle cx="90" cy="50" r="110" fill="#00f2fe" fill-opacity="0.12" filter="url(#glow-heavy)">
      <animate attributeName="cx" values="90;130;90" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.08;0.16;0.08" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="160" r="130" fill="#f72585" fill-opacity="0.1" filter="url(#glow-heavy)">
      <animate attributeName="cx" values="760;720;760" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.07;0.15;0.07" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Scanning Laser -->
    <rect x="-300" y="0" width="300" height="210" fill="url(#laser-beam)" opacity="0.12">
      <animate attributeName="x" values="-300;850;-300" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- Top Running Border -->
    <rect x="-850" y="0" width="1700" height="2.5" fill="url(#neon-name)">
      <animate attributeName="x" values="-850;0;-850" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- HUD Frame Corners -->
    <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>
    <path d="M 838 28 L 838 12 L 822 12" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.8"/>
    <path d="M 12 182 L 12 198 L 28 198" fill="none" stroke="#f72585" stroke-width="2" opacity="0.8"/>
    <path d="M 838 182 L 838 198 L 822 198" fill="none" stroke="#f72585" stroke-width="2" opacity="0.8"/>

    <!-- Outer Border -->
    <rect width="850" height="210" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.2"/>

    <!-- ================= LEFT CONTENT ================= -->
    <!-- Greeting Pill -->
    <g transform="translate(32, 20)">
      <rect width="160" height="24" rx="12" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="14" cy="12" r="3.5" fill="#00f2fe" filter="url(#glow-subtle)">
        <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="17" class="f-cond-tag" fill="#00f2fe">👋 HELLO WORLD</text>
    </g>

    <!-- TITLE: ARPIT RANA (Elongated Condensed) -->
    <g transform="translate(32, 88)">
      <text x="0" y="0" class="f-cond-hero" fill="url(#neon-name)" filter="url(#glow-heavy)" opacity="0.6">ARPIT RANA</text>
      <text x="0" y="0" class="f-cond-hero" fill="url(#neon-name)">ARPIT RANA</text>
    </g>

    <!-- Terminal Subtitle / Role Box -->
    <g transform="translate(32, 120)">
      <rect x="0" y="-16" width="460" height="32" rx="8" fill="#070e22" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
      <text x="12" y="5" class="f-cond-sub" fill="#00f2fe">❯</text>
      
      <!-- Role Cycle -->
      <g>
        <text x="32" y="5" class="f-cond-sub" fill="#f1f5f9">
          AI &amp; Cybersecurity Enthusiast
          <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.30;0.33;0.66;0.70;0.97;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <text x="32" y="5" class="f-cond-sub" fill="#38bdf8" opacity="0">
          B.Tech CSE Core Undergrad @ LPU
          <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.30;0.34;0.63;0.67;0.97;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <text x="32" y="5" class="f-cond-sub" fill="#ec4899" opacity="0">
          Builder • Explorer • Problem Solver
          <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.63;0.67;0.70;0.94;0.98;1" dur="9s" repeatCount="indefinite"/>
        </text>
      </g>

      <!-- Cursor -->
      <rect x="435" y="-8" width="7" height="16" rx="2" fill="#00f2fe" filter="url(#glow-subtle)">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Mini Spec Chips (Elongated Condensed) -->
    <g transform="translate(32, 168)">
      <rect x="0" y="0" width="100" height="24" rx="6" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.35"/>
      <text x="50" y="16" class="f-cond-chip" fill="#7dd3fc" text-anchor="middle">⚡ AI / ML</text>

      <rect x="110" y="0" width="110" height="24" rx="6" fill="#9d4edd" fill-opacity="0.1" stroke="#9d4edd" stroke-opacity="0.35"/>
      <text x="165" y="16" class="f-cond-chip" fill="#c4b5fd" text-anchor="middle">🔒 CYBERSEC</text>

      <rect x="230" y="0" width="115" height="24" rx="6" fill="#f72585" fill-opacity="0.1" stroke="#f72585" stroke-opacity="0.35"/>
      <text x="287" y="16" class="f-cond-chip" fill="#f472b6" text-anchor="middle">🚀 FULLSTACK</text>

      <rect x="355" y="0" width="100" height="24" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="405" y="16" class="f-cond-chip" fill="#94a3b8" text-anchor="middle">🎓 LPU CSE</text>
    </g>

    <!-- ================= RIGHT PANEL ================= -->
    <!-- Collab Status Pill -->
    <g transform="translate(555, 20)">
      <rect width="260" height="30" rx="10" fill="#070e22" fill-opacity="0.9" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
      <circle cx="18" cy="15" r="4" fill="#10b981" filter="url(#glow-subtle)">
        <animate attributeName="r" values="3.5;5.5;3.5" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" class="f-cond-tag" fill="#34d399">OPEN FOR COLLABORATION</text>
    </g>

    <!-- Radar Sphere -->
    <g transform="translate(740, 115)">
      <circle cx="0" cy="0" r="40" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5, 4" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#f72585" stroke-width="1.2" stroke-dasharray="6, 5" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="18" fill="#090f26" stroke="#00f2fe" stroke-width="1.5"/>
      <text x="0" y="6" font-size="18" text-anchor="middle">⚡</text>
      <line x1="0" y1="0" x2="32" y2="-18" stroke="#00f2fe" stroke-width="1.8" opacity="0.85">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Audio Equalizer Spectrum -->
    <g transform="translate(555, 150)">
      <text x="0" y="-10" class="f-cond-tag" font-size="11" fill="#64748b">ACTIVITY SPECTRUM</text>
      
      <!-- 10 Bars -->
      <rect x="0" y="0" width="5" height="20" rx="2.5" fill="#00f2fe">
        <animate attributeName="height" values="8;30;12;34;8" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="26;4;22;0;26" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="9" y="0" width="5" height="24" rx="2.5" fill="#00f2fe">
        <animate attributeName="height" values="20;6;32;10;20" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="14;28;2;24;14" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="18" y="0" width="5" height="15" rx="2.5" fill="#38bdf8">
        <animate attributeName="height" values="32;14;36;18;32" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="2;20;-2;16;2" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="27" y="0" width="5" height="22" rx="2.5" fill="#38bdf8">
        <animate attributeName="height" values="10;34;6;30;10" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="24;0;28;4;24" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="36" y="0" width="5" height="28" rx="2.5" fill="#818cf8">
        <animate attributeName="height" values="26;10;34;14;26" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="8;24;0;20;8" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="45" y="0" width="5" height="12" rx="2.5" fill="#9d4edd">
        <animate attributeName="height" values="14;32;8;30;14" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="20;2;26;4;20" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="54" y="0" width="5" height="24" rx="2.5" fill="#9d4edd">
        <animate attributeName="height" values="30;8;36;12;30" dur="1.0s" repeatCount="indefinite"/>
        <animate attributeName="y" values="4;26;-2;22;4" dur="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="63" y="0" width="5" height="16" rx="2.5" fill="#f72585">
        <animate attributeName="height" values="8;30;14;34;8" dur="1.35s" repeatCount="indefinite"/>
        <animate attributeName="y" values="26;4;20;0;26" dur="1.35s" repeatCount="indefinite"/>
      </rect>
      <rect x="72" y="0" width="5" height="26" rx="2.5" fill="#f72585">
        <animate attributeName="height" values="30;12;26;6;30" dur="1.15s" repeatCount="indefinite"/>
        <animate attributeName="y" values="4;22;8;28;4" dur="1.15s" repeatCount="indefinite"/>
      </rect>
      <rect x="81" y="0" width="5" height="18" rx="2.5" fill="#00f2fe">
        <animate attributeName="height" values="14;32;10;28;14" dur="1.25s" repeatCount="indefinite"/>
        <animate attributeName="y" values="20;2;24;6;20" dur="1.25s" repeatCount="indefinite"/>
      </rect>
    </g>

  </g>
</svg>
