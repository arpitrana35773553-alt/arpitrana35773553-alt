<svg width="850" height="210" viewBox="0 0 850 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&amp;family=Fira+Code:wght@600&amp;display=swap');
      .hdr-cond {
        font-family: 'Barlow Condensed', 'Arial Narrow', -apple-system-condensed, sans-serif-condensed, sans-serif;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      .metric-lbl-cond {
        font-family: 'Barlow Condensed', 'Arial Narrow', -apple-system-condensed, sans-serif-condensed, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .metric-val-cond {
        font-family: 'Barlow Condensed', 'Arial Narrow', -apple-system-condensed, sans-serif-condensed, sans-serif;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .lang-title-cond {
        font-family: 'Barlow Condensed', 'Arial Narrow', -apple-system-condensed, sans-serif-condensed, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .lang-pct-cond {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 11px;
        font-weight: 700;
      }
      .matrix-lbl-cond {
        font-family: 'Barlow Condensed', 'Arial Narrow', -apple-system-condensed, sans-serif-condensed, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #475569;
        text-transform: uppercase;
      }
    </style>

    <linearGradient id="gs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#080e22"/>
      <stop offset="100%" stop-color="#120822"/>
    </linearGradient>

    <linearGradient id="laser-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <filter id="gs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="gs-clip">
      <rect width="850" height="210" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#gs-clip)">
    <!-- Base Background -->
    <rect width="850" height="210" fill="url(#gs-bg)"/>

    <!-- Ambient Glowing Blobs -->
    <circle cx="90" cy="180" r="140" fill="#00f2fe" fill-opacity="0.1" filter="url(#gs-glow)">
      <animate attributeName="fill-opacity" values="0.06;0.16;0.06" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="40" r="140" fill="#9d4edd" fill-opacity="0.1" filter="url(#gs-glow)">
      <animate attributeName="fill-opacity" values="0.06;0.15;0.06" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Border -->
    <rect width="850" height="210" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.2"/>

    <!-- ================= LEFT CARD: GITHUB TELEMETRY & LIVE HEATMAP ================= -->
    <g transform="translate(16, 12)">
      <rect width="400" height="186" rx="12" fill="#070c1e" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
      
      <!-- Card Header -->
      <text x="16" y="24" class="hdr-cond" fill="#38bdf8">⚡ GITHUB METRICS &amp; ACTIVITY</text>
      <circle cx="376" cy="18" r="4" fill="#10b981" filter="url(#gs-glow)">
        <animate attributeName="r" values="3.5;6;3.5" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      </circle>

      <!-- 4 Floating Metric Badges -->
      <!-- Metric 1: Streak -->
      <g transform="translate(16, 36)">
        <animateTransform attributeName="transform" type="translate" values="16,36; 16,33; 16,36" dur="3s" repeatCount="indefinite"/>
        <rect width="176" height="42" rx="8" fill="#0b1633" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1"/>
        <rect width="3" height="42" rx="1.5" fill="#3b82f6"/>
        <text x="12" y="18" class="metric-lbl-cond" fill="#94a3b8">DAILY STREAK</text>
        <text x="12" y="34" class="metric-val-cond" fill="#60a5fa">🔥 100% ACTIVE</text>
      </g>

      <!-- Metric 2: Contributions -->
      <g transform="translate(208, 36)">
        <animateTransform attributeName="transform" type="translate" values="208,36; 208,33; 208,36" dur="3.4s" begin="0.3s" repeatCount="indefinite"/>
        <rect width="176" height="42" rx="8" fill="#0b1633" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
        <rect width="3" height="42" rx="1.5" fill="#8b5cf6"/>
        <text x="12" y="18" class="metric-lbl-cond" fill="#94a3b8">COMMITS &amp; PRs</text>
        <text x="12" y="34" class="metric-val-cond" fill="#c4b5fd">🚀 CONSTANT PUSH</text>
      </g>

      <!-- Metric 3: Code Velocity -->
      <g transform="translate(16, 84)">
        <animateTransform attributeName="transform" type="translate" values="16,84; 16,81; 16,84" dur="3.8s" begin="0.6s" repeatCount="indefinite"/>
        <rect width="176" height="42" rx="8" fill="#0b1633" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
        <rect width="3" height="42" rx="1.5" fill="#10b981"/>
        <text x="12" y="18" class="metric-lbl-cond" fill="#94a3b8">SYSTEM UPTIME</text>
        <text x="12" y="34" class="metric-val-cond" fill="#34d399">⚡ 99.9% COMMITTED</text>
      </g>

      <!-- Metric 4: Focus -->
      <g transform="translate(208, 84)">
        <animateTransform attributeName="transform" type="translate" values="208,84; 208,81; 208,84" dur="4.2s" begin="0.9s" repeatCount="indefinite"/>
        <rect width="176" height="42" rx="8" fill="#0b1633" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
        <rect width="3" height="42" rx="1.5" fill="#ec4899"/>
        <text x="12" y="18" class="metric-lbl-cond" fill="#94a3b8">BUILD VELOCITY</text>
        <text x="12" y="34" class="metric-val-cond" fill="#f472b6">🤖 HIGH AGILITY</text>
      </g>

      <!-- Live Animated GitHub Commit Matrix / Wave Grid (14 columns x 2 rows) -->
      <g transform="translate(16, 138)">
        <text x="0" y="-4" class="matrix-lbl-cond">LIVE COMMIT ACTIVITY WAVE</text>
        
        <!-- Row 1 -->
        <rect x="0" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="0.3"><animate attributeName="fill-opacity" values="0.2;0.8;0.2" dur="2s" repeatCount="indefinite"/></rect>
        <rect x="26" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="0.7"><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></rect>
        <rect x="52" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="0.4"><animate attributeName="fill-opacity" values="0.2;0.9;0.2" dur="2.2s" repeatCount="indefinite"/></rect>
        <rect x="78" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="0.9"><animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/></rect>
        <rect x="104" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="0.5"><animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="2.4s" repeatCount="indefinite"/></rect>
        <rect x="130" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="1.0"><animate attributeName="fill-opacity" values="0.6;1;0.6" dur="1.4s" repeatCount="indefinite"/></rect>
        <rect x="156" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="0.6"><animate attributeName="fill-opacity" values="0.3;0.9;0.3" dur="2.0s" repeatCount="indefinite"/></rect>
        <rect x="182" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="0.8"><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="1.7s" repeatCount="indefinite"/></rect>
        <rect x="208" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="0.4"><animate attributeName="fill-opacity" values="0.2;0.7;0.2" dur="2.3s" repeatCount="indefinite"/></rect>
        <rect x="234" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="0.9"><animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/></rect>
        <rect x="260" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="0.7"><animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="2.1s" repeatCount="indefinite"/></rect>
        <rect x="286" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="1.0"><animate attributeName="fill-opacity" values="0.6;1;0.6" dur="1.3s" repeatCount="indefinite"/></rect>
        <rect x="312" y="4" width="22" height="10" rx="3" fill="#10b981" fill-opacity="0.5"><animate attributeName="fill-opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite"/></rect>
        <rect x="338" y="4" width="28" height="10" rx="3" fill="#10b981" fill-opacity="0.9"><animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/></rect>

        <!-- Row 2 -->
        <rect x="0" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="0.6"><animate attributeName="fill-opacity" values="0.3;0.9;0.3" dur="1.9s" repeatCount="indefinite"/></rect>
        <rect x="26" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="0.9"><animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/></rect>
        <rect x="52" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="0.4"><animate attributeName="fill-opacity" values="0.2;0.7;0.2" dur="2.1s" repeatCount="indefinite"/></rect>
        <rect x="78" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="0.8"><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="1.7s" repeatCount="indefinite"/></rect>
        <rect x="104" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="1.0"><animate attributeName="fill-opacity" values="0.6;1;0.6" dur="1.3s" repeatCount="indefinite"/></rect>
        <rect x="130" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="0.5"><animate attributeName="fill-opacity" values="0.2;0.8;0.2" dur="2.4s" repeatCount="indefinite"/></rect>
        <rect x="156" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="0.9"><animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/></rect>
        <rect x="182" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="0.7"><animate attributeName="fill-opacity" values="0.3;0.9;0.3" dur="2.0s" repeatCount="indefinite"/></rect>
        <rect x="208" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="1.0"><animate attributeName="fill-opacity" values="0.6;1;0.6" dur="1.4s" repeatCount="indefinite"/></rect>
        <rect x="234" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="0.4"><animate attributeName="fill-opacity" values="0.2;0.8;0.2" dur="2.2s" repeatCount="indefinite"/></rect>
        <rect x="260" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="0.8"><animate attributeName="fill-opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></rect>
        <rect x="286" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="0.5"><animate attributeName="fill-opacity" values="0.3;0.8;0.3" dur="2.3s" repeatCount="indefinite"/></rect>
        <rect x="312" y="18" width="22" height="10" rx="3" fill="#38bdf8" fill-opacity="0.9"><animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/></rect>
        <rect x="338" y="18" width="28" height="10" rx="3" fill="#38bdf8" fill-opacity="1.0"><animate attributeName="fill-opacity" values="0.6;1;0.6" dur="1.2s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <!-- ================= RIGHT CARD: DYNAMIC ANIMATED LANGUAGE BARS ================= -->
    <g transform="translate(434, 12)">
      <rect width="400" height="186" rx="12" fill="#070c1e" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1"/>
      
      <text x="16" y="24" class="hdr-cond" fill="#c4b5fd">📊 TOP DOMAINS &amp; LANGUAGES</text>

      <!-- Bar 1: Python & AI -->
      <g transform="translate(16, 42)">
        <text x="0" y="10" class="lang-title-cond" fill="#93c5fd">🐍 PYTHON &amp; AI NEURAL STACK</text>
        <text x="368" y="10" class="lang-pct-cond" fill="#93c5fd" text-anchor="end">40%</text>
        
        <!-- Track -->
        <rect y="16" width="368" height="8" rx="4" fill="#0b1633"/>
        <!-- Animated Fill Bar -->
        <rect y="16" width="147" height="8" rx="4" fill="#38bdf8" filter="url(#gs-glow)">
          <animate attributeName="width" values="120;147;120" dur="4s" repeatCount="indefinite"/>
        </rect>
        <!-- Laser Pulse on top of bar -->
        <rect y="16" width="30" height="8" rx="4" fill="url(#laser-glow)">
          <animate attributeName="x" values="0;120;0" dur="2.5s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Bar 2: C++ & Algorithms -->
      <g transform="translate(16, 78)">
        <text x="0" y="10" class="lang-title-cond" fill="#c4b5fd">⚡ C++ &amp; CORE PROBLEM SOLVING</text>
        <text x="368" y="10" class="lang-pct-cond" fill="#c4b5fd" text-anchor="end">30%</text>
        
        <rect y="16" width="368" height="8" rx="4" fill="#0b1633"/>
        <rect y="16" width="110" height="8" rx="4" fill="#8b5cf6" filter="url(#gs-glow)">
          <animate attributeName="width" values="90;110;90" dur="4.5s" repeatCount="indefinite"/>
        </rect>
        <rect y="16" width="26" height="8" rx="4" fill="url(#laser-glow)">
          <animate attributeName="x" values="0;85;0" dur="2.8s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Bar 3: Web & TypeScript -->
      <g transform="translate(16, 114)">
        <text x="0" y="10" class="lang-title-cond" fill="#fde047">🟡 JAVASCRIPT / TYPESCRIPT / REACT</text>
        <text x="368" y="10" class="lang-pct-cond" fill="#fde047" text-anchor="end">20%</text>
        
        <rect y="16" width="368" height="8" rx="4" fill="#0b1633"/>
        <rect y="16" width="74" height="8" rx="4" fill="#eab308" filter="url(#gs-glow)">
          <animate attributeName="width" values="55;74;55" dur="5s" repeatCount="indefinite"/>
        </rect>
        <rect y="16" width="20" height="8" rx="4" fill="url(#laser-glow)">
          <animate attributeName="x" values="0;54;0" dur="3.0s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Bar 4: Cybersecurity & Linux -->
      <g transform="translate(16, 150)">
        <text x="0" y="10" class="lang-title-cond" fill="#34d399">🛡️ CYBERSECURITY, SEC-OPS &amp; LINUX</text>
        <text x="368" y="10" class="lang-pct-cond" fill="#34d399" text-anchor="end">10%</text>
        
        <rect y="16" width="368" height="8" rx="4" fill="#0b1633"/>
        <rect y="16" width="37" height="8" rx="4" fill="#10b981" filter="url(#gs-glow)">
          <animate attributeName="width" values="26;37;26" dur="3.5s" repeatCount="indefinite"/>
        </rect>
        <rect y="16" width="16" height="8" rx="4" fill="url(#laser-glow)">
          <animate attributeName="x" values="0;20;0" dur="2.2s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

  </g>
</svg>
