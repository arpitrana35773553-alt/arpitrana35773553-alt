<svg width="850" height="180" viewBox="0 0 850 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      .stat-num {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 16px;
        font-weight: 800;
      }
      .stat-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
      }
      .lang-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 11.5px;
        font-weight: 700;
      }
      .lang-pct {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        font-weight: 600;
      }
    </style>

    <linearGradient id="gst-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#080e22"/>
      <stop offset="100%" stop-color="#120822"/>
    </linearGradient>

    <filter id="gst-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="gst-clip">
      <rect width="850" height="180" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#gst-clip)">
    <!-- Base -->
    <rect width="850" height="180" fill="url(#gst-bg)"/>
    <rect width="850" height="180" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.2"/>

    <!-- ================= LEFT CARD: GITHUB TELEMETRY ================= -->
    <g transform="translate(16, 14)">
      <!-- Panel Box -->
      <rect width="400" height="152" rx="12" fill="#070c1e" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>
      
      <!-- Panel Header -->
      <text x="18" y="24" class="card-title" fill="#38bdf8">⚡ GITHUB METRICS &amp; ACTIVITY</text>
      <circle cx="375" cy="18" r="4" fill="#10b981" filter="url(#gst-glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <!-- Stat Box 1: Streak -->
      <g transform="translate(18, 38)">
        <rect width="176" height="46" rx="8" fill="#0b1633" stroke="#3b82f6" stroke-opacity="0.3"/>
        <text x="12" y="22" class="stat-label">CURRENT STREAK</text>
        <text x="12" y="38" class="stat-num" fill="#60a5fa">🔥 ACTIVE &amp; DAILY</text>
      </g>

      <!-- Stat Box 2: Total Repos & Code -->
      <g transform="translate(206, 38)">
        <rect width="176" height="46" rx="8" fill="#0b1633" stroke="#8b5cf6" stroke-opacity="0.3"/>
        <text x="12" y="22" class="stat-label">CONTRIBUTIONS</text>
        <text x="12" y="38" class="stat-num" fill="#c4b5fd">🚀 GROWING FAST</text>
      </g>

      <!-- Stat Box 3: Quality -->
      <g transform="translate(18, 92)">
        <rect width="176" height="46" rx="8" fill="#0b1633" stroke="#10b981" stroke-opacity="0.3"/>
        <text x="12" y="22" class="stat-label">SYSTEM UPTIME</text>
        <text x="12" y="38" class="stat-num" fill="#34d399">⚡ 99.9% COMMITTED</text>
      </g>

      <!-- Stat Box 4: Focus -->
      <g transform="translate(206, 92)">
        <rect width="176" height="46" rx="8" fill="#0b1633" stroke="#ec4899" stroke-opacity="0.3"/>
        <text x="12" y="22" class="stat-label">CODE VELOCITY</text>
        <text x="12" y="38" class="stat-num" fill="#f472b6">🤖 HIGH AGILITY</text>
      </g>
    </g>

    <!-- ================= RIGHT CARD: LANGUAGE DISTRIBUTION ================= -->
    <g transform="translate(434, 14)">
      <rect width="400" height="152" rx="12" fill="#070c1e" stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="1"/>
      
      <text x="18" y="24" class="card-title" fill="#c4b5fd">📊 TOP DOMAINS &amp; LANGUAGES</text>

      <!-- Bar 1: Python & AI -->
      <g transform="translate(18, 40)">
        <text x="0" y="10" class="lang-name" fill="#93c5fd">🐍 Python &amp; AI Stack</text>
        <text x="364" y="10" class="lang-pct" fill="#93c5fd" text-anchor="end">40%</text>
        <rect y="16" width="364" height="6" rx="3" fill="#0b1633"/>
        <rect y="16" width="145" height="6" rx="3" fill="#38bdf8" filter="url(#gst-glow)">
          <animate attributeName="width" values="120;145;120" dur="4s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Bar 2: C++ & Core -->
      <g transform="translate(18, 68)">
        <text x="0" y="10" class="lang-name" fill="#c4b5fd">⚡ C++ &amp; Algorithms</text>
        <text x="364" y="10" class="lang-pct" fill="#c4b5fd" text-anchor="end">30%</text>
        <rect y="16" width="364" height="6" rx="3" fill="#0b1633"/>
        <rect y="16" width="110" height="6" rx="3" fill="#8b5cf6">
          <animate attributeName="width" values="95;110;95" dur="4.5s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Bar 3: Web & TypeScript -->
      <g transform="translate(18, 96)">
        <text x="0" y="10" class="lang-name" fill="#fde047">🟡 JavaScript / TS / Web</text>
        <text x="364" y="10" class="lang-pct" fill="#fde047" text-anchor="end">20%</text>
        <rect y="16" width="364" height="6" rx="3" fill="#0b1633"/>
        <rect y="16" width="73" height="6" rx="3" fill="#eab308">
          <animate attributeName="width" values="60;73;60" dur="5s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Bar 4: CyberSec Tools -->
      <g transform="translate(18, 124)">
        <text x="0" y="10" class="lang-name" fill="#34d399">🛡️ Cybersecurity &amp; Linux</text>
        <text x="364" y="10" class="lang-pct" fill="#34d399" text-anchor="end">10%</text>
        <rect y="16" width="364" height="6" rx="3" fill="#0b1633"/>
        <rect y="16" width="36" height="6" rx="3" fill="#10b981">
          <animate attributeName="width" values="28;36;28" dur="3.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

  </g>
</svg>
