<svg width="850" height="90" viewBox="0 0 850 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .lbl {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      .val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
    </style>

    <filter id="b-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090e1f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bg-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090e1f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090e1f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="bg-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090e1f" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- ================= BADGE 1: LOCATION ================= -->
  <g transform="translate(10, 8)">
    <animateTransform attributeName="transform" type="translate"
      values="10,8; 10,2; 10,8" dur="4s"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0; 0.5; 1"
      repeatCount="indefinite"/>
    
    <rect width="198" height="70" rx="12" fill="url(#bg-1)" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect width="4" height="70" rx="2" fill="#0284c7" filter="url(#b-glow)"/>
    
    <rect x="14" y="15" width="38" height="38" rx="10" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-opacity="0.3"/>
    <text x="33" y="40" font-size="19" text-anchor="middle">🏔️</text>

    <circle cx="180" cy="18" r="3" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <text x="62" y="31" class="lbl" fill="#38bdf8">LOCATION</text>
    <text x="62" y="49" class="val" fill="#f0f9ff">Himachal, India</text>
  </g>

  <!-- ================= BADGE 2: DEGREE ================= -->
  <g transform="translate(220, 8)">
    <animateTransform attributeName="transform" type="translate"
      values="220,8; 220,2; 220,8" dur="4.4s" begin="0.3s"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0; 0.5; 1"
      repeatCount="indefinite"/>
    
    <rect width="198" height="70" rx="12" fill="url(#bg-2)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect width="4" height="70" rx="2" fill="#3b82f6" filter="url(#b-glow)"/>
    
    <rect x="14" y="15" width="38" height="38" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3"/>
    <text x="33" y="40" font-size="19" text-anchor="middle">🎓</text>

    <circle cx="180" cy="18" r="3" fill="#60a5fa">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.7s" repeatCount="indefinite"/>
    </circle>

    <text x="62" y="31" class="lbl" fill="#60a5fa">DEGREE</text>
    <text x="62" y="49" class="val" fill="#f0f9ff">B.Tech CSE Core</text>
  </g>

  <!-- ================= BADGE 3: UNIVERSITY ================= -->
  <g transform="translate(430, 8)">
    <animateTransform attributeName="transform" type="translate"
      values="430,8; 430,2; 430,8" dur="4.8s" begin="0.6s"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0; 0.5; 1"
      repeatCount="indefinite"/>
    
    <rect width="198" height="70" rx="12" fill="url(#bg-3)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect width="4" height="70" rx="2" fill="#8b5cf6" filter="url(#b-glow)"/>
    
    <rect x="14" y="15" width="38" height="38" rx="10" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.3"/>
    <text x="33" y="40" font-size="19" text-anchor="middle">🏛️</text>

    <circle cx="180" cy="18" r="3" fill="#a78bfa">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/>
    </circle>

    <text x="62" y="31" class="lbl" fill="#a78bfa">UNIVERSITY</text>
    <text x="62" y="49" class="val" fill="#f0f9ff">LPU Punjab</text>
  </g>

  <!-- ================= BADGE 4: FOCUS ================= -->
  <g transform="translate(640, 8)">
    <animateTransform attributeName="transform" type="translate"
      values="640,8; 640,2; 640,8" dur="5.2s" begin="0.9s"
      calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" keyTimes="0; 0.5; 1"
      repeatCount="indefinite"/>
    
    <rect width="200" height="70" rx="12" fill="url(#bg-4)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect width="4" height="70" rx="2" fill="#ec4899" filter="url(#b-glow)"/>
    
    <rect x="14" y="15" width="38" height="38" rx="10" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.3"/>
    <text x="33" y="40" font-size="19" text-anchor="middle">🤖</text>

    <circle cx="182" cy="18" r="3" fill="#f472b6">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/>
    </circle>

    <text x="62" y="31" class="lbl" fill="#f472b6">FOCUS AREA</text>
    <text x="62" y="49" class="val" fill="#f0f9ff">AI + CyberSec</text>
  </g>
</svg>
