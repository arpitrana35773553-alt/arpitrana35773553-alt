<svg width="850" height="95" viewBox="0 0 850 95" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .quote-txt {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }
      .quote-sub {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 11px;
      }
      .pill-txt {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 11px;
        font-weight: 700;
      }
    </style>

    <linearGradient id="ftl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="33%" stop-color="#38bdf8"/>
      <stop offset="66%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>

    <linearGradient id="fring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#38bdf8;#9d4edd;#f72585;#00f2fe" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f72585">
        <animate attributeName="stop-color" values="#f72585;#00f2fe;#38bdf8;#9d4edd;#f72585" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="fclip"><rect width="850" height="3.5"/></clipPath>
    <clipPath id="fcard"><rect width="850" height="95" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#fcard)">
    <!-- Base -->
    <rect width="850" height="95" rx="16" fill="#06091a"/>
    <rect width="850" height="95" rx="16" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1.2"/>

    <!-- Top Animated Laser Line -->
    <g clip-path="url(#fclip)">
      <rect width="1700" height="3.5" fill="url(#ftl)">
        <animateTransform attributeName="transform" type="translate" values="0,0;-850,0;0,0" dur="4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Bottom Running Glow Line -->
    <g transform="translate(0, 92)" clip-path="url(#fclip)">
      <rect width="1700" height="3" fill="url(#ftl)">
        <animateTransform attributeName="transform" type="translate" values="-850,0;0,0;-850,0" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- LEFT: Quote & Dev Mantra -->
    <g transform="translate(28, 20)">
      <text x="0" y="20" class="quote-txt" fill="#f1f5f9" font-style="italic">"Build. Break. Learn. Repeat."</text>
      <text x="0" y="42" class="quote-sub" fill="#64748b">// arpit's dev mantra ⚡ 60 fps</text>
    </g>

    <!-- CENTER: Holographic Orbiting Rocket Core -->
    <g transform="translate(425, 48)">
      <!-- Outer Orbit Ring -->
      <circle cx="0" cy="0" r="30" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="6, 4" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </circle>
      <!-- Inner Orbit Ring -->
      <circle cx="0" cy="0" r="23" fill="none" stroke="#f72585" stroke-width="1.2" stroke-dasharray="4, 4" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
      </circle>
      <!-- Glowing Core -->
      <circle cx="0" cy="0" r="17" fill="#070b17" stroke="url(#fring)" stroke-width="2" filter="url(#f-glow)">
        <animate attributeName="r" values="16;18.5;16" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <!-- Rocket Icon with Bobbing float -->
      <text x="0" y="6" font-size="18" text-anchor="middle">
        🚀
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="2s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif" font-size="9" font-weight="800" fill="#64748b" text-anchor="middle" letter-spacing="1">ARPIT RANA</text>
    </g>

    <!-- RIGHT: Dynamic Animated Status Pills -->
    <g transform="translate(530, 18)">
      <!-- Pill 1: Open to Internships -->
      <g transform="translate(0, 0)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="3s" repeatCount="indefinite"/>
        <rect width="145" height="24" rx="12" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="14" cy="12" r="3.5" fill="#10b981" filter="url(#f-glow)">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="24" y="16" class="pill-txt" fill="#34d399">Open to Internships</text>
      </g>

      <!-- Pill 2: Active Learner -->
      <g transform="translate(155, 0)">
        <animateTransform attributeName="transform" type="translate" values="155,0; 155,-2; 155,0" dur="3.5s" begin="0.3s" repeatCount="indefinite"/>
        <rect width="135" height="24" rx="12" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="14" cy="12" r="3.5" fill="#38bdf8" filter="url(#f-glow)">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="24" y="16" class="pill-txt" fill="#38bdf8">Active Learner</text>
      </g>

      <!-- Pill 3: B.Tech CSE -->
      <g transform="translate(0, 32)">
        <animateTransform attributeName="transform" type="translate" values="0,32; 0,30; 0,32" dur="4s" begin="0.6s" repeatCount="indefinite"/>
        <rect width="145" height="24" rx="12" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="14" cy="12" r="3.5" fill="#c084fc" filter="url(#f-glow)">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="24" y="16" class="pill-txt" fill="#c084fc">B.Tech CSE · LPU</text>
      </g>

      <!-- Pill 4: Online Status -->
      <g transform="translate(155, 32)">
        <animateTransform attributeName="transform" type="translate" values="155,32; 155,30; 155,32" dur="4.2s" begin="0.9s" repeatCount="indefinite"/>
        <rect width="135" height="24" rx="12" fill="#f72585" fill-opacity="0.12" stroke="#f72585" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="14" cy="12" r="3.5" fill="#f72585" filter="url(#f-glow)">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="24" y="16" class="pill-txt" fill="#f472b6">SecOps // AI</text>
      </g>
    </g>
  </g>
</svg>
