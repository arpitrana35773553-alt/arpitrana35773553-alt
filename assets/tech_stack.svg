<svg width="850" height="280" viewBox="0 0 850 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Oswald:wght@500;700&amp;display=swap');
      .title-condensed {
        font-family: 'Bebas Neue', 'Oswald', 'Impact', 'Arial Narrow', sans-serif-condensed, sans-serif;
        font-size: 26px;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .tag-condensed {
        font-family: 'Oswald', 'Impact', 'Arial Narrow', sans-serif-condensed, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .cat-label {
        font-family: 'Oswald', 'Impact', 'Arial Narrow', sans-serif-condensed, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .chip-text {
        font-family: 'Oswald', 'Impact', 'Arial Narrow', sans-serif-condensed, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
    </style>

    <linearGradient id="ts-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060917"/>
      <stop offset="50%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#120822"/>
    </linearGradient>

    <filter id="ts-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="ts-clip">
      <rect width="850" height="280" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ts-clip)">
    <!-- Base -->
    <rect width="850" height="280" fill="url(#ts-bg)"/>

    <!-- Ambient Glows -->
    <circle cx="80" cy="80" r="140" fill="#00f2fe" fill-opacity="0.08" filter="url(#ts-glow)"/>
    <circle cx="780" cy="200" r="160" fill="#9d4edd" fill-opacity="0.09" filter="url(#ts-glow)"/>

    <!-- Border -->
    <rect width="850" height="280" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5"/>

    <!-- HUD Header Row -->
    <g transform="translate(28, 22)">
      <text x="0" y="24" class="title-condensed" fill="#ffffff">⚙️ TECH STACK // ARSENAL</text>
      
      <rect x="250" y="6" width="130" height="22" rx="6" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.4"/>
      <text x="315" y="21" class="tag-condensed" fill="#00f2fe" text-anchor="middle">CORE COMPETENCIES</text>

      <line x1="390" y1="17" x2="800" y2="17" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1"/>
    </g>

    <!-- ================= ROW 1: CORE LANGUAGES ================= -->
    <g transform="translate(28, 62)">
      <!-- Category Box -->
      <rect width="115" height="36" rx="8" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-opacity="0.45" stroke-width="1"/>
      <text x="57" y="23" class="cat-label" fill="#38bdf8" text-anchor="middle">⚡ LANGUAGES</text>

      <!-- Chips (with floating pop animation) -->
      <!-- Python -->
      <g transform="translate(125, 0)">
        <animateTransform attributeName="transform" type="translate" values="125,0; 125,-3; 125,0" dur="3s" repeatCount="indefinite"/>
        <rect width="115" height="36" rx="8" fill="#0b1633" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="57" y="23" class="chip-text" fill="#93c5fd" text-anchor="middle">🐍 PYTHON</text>
      </g>
      <!-- C++ -->
      <g transform="translate(248, 0)">
        <animateTransform attributeName="transform" type="translate" values="248,0; 248,-3; 248,0" dur="3.3s" begin="0.2s" repeatCount="indefinite"/>
        <rect width="95" height="36" rx="8" fill="#0b1633" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="47" y="23" class="chip-text" fill="#c4b5fd" text-anchor="middle">⚡ C++</text>
      </g>
      <!-- C -->
      <g transform="translate(351, 0)">
        <animateTransform attributeName="transform" type="translate" values="351,0; 351,-3; 351,0" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
        <rect width="80" height="36" rx="8" fill="#0b1633" stroke="#4f46e5" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="40" y="23" class="chip-text" fill="#a5b4fc" text-anchor="middle">🔵 C</text>
      </g>
      <!-- JavaScript -->
      <g transform="translate(439, 0)">
        <animateTransform attributeName="transform" type="translate" values="439,0; 439,-3; 439,0" dur="3.9s" begin="0.6s" repeatCount="indefinite"/>
        <rect width="135" height="36" rx="8" fill="#0b1633" stroke="#eab308" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="67" y="23" class="chip-text" fill="#fde047" text-anchor="middle">🟡 JAVASCRIPT</text>
      </g>
      <!-- TypeScript -->
      <g transform="translate(582, 0)">
        <animateTransform attributeName="transform" type="translate" values="582,0; 582,-3; 582,0" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
        <rect width="135" height="36" rx="8" fill="#0b1633" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="67" y="23" class="chip-text" fill="#93c5fd" text-anchor="middle">🔷 TYPESCRIPT</text>
      </g>
    </g>

    <!-- ================= ROW 2: WEB ARCHITECTURE ================= -->
    <g transform="translate(28, 112)">
      <!-- Category Box -->
      <rect width="115" height="36" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.45" stroke-width="1"/>
      <text x="57" y="23" class="cat-label" fill="#34d399" text-anchor="middle">🌐 WEB &amp; APIS</text>

      <!-- HTML5 -->
      <g transform="translate(125, 0)">
        <animateTransform attributeName="transform" type="translate" values="125,0; 125,-3; 125,0" dur="3.2s" begin="0.1s" repeatCount="indefinite"/>
        <rect width="105" height="36" rx="8" fill="#0b1633" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="52" y="23" class="chip-text" fill="#fca5a5" text-anchor="middle">🌐 HTML5</text>
      </g>
      <!-- CSS3 -->
      <g transform="translate(238, 0)">
        <animateTransform attributeName="transform" type="translate" values="238,0; 238,-3; 238,0" dur="3.5s" begin="0.3s" repeatCount="indefinite"/>
        <rect width="95" height="36" rx="8" fill="#0b1633" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="47" y="23" class="chip-text" fill="#93c5fd" text-anchor="middle">🎨 CSS3</text>
      </g>
      <!-- React -->
      <g transform="translate(341, 0)">
        <animateTransform attributeName="transform" type="translate" values="341,0; 341,-3; 341,0" dur="3.8s" begin="0.5s" repeatCount="indefinite"/>
        <rect width="115" height="36" rx="8" fill="#0b1633" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="57" y="23" class="chip-text" fill="#67e8f9" text-anchor="middle">⚛️ REACT.JS</text>
      </g>
      <!-- Node.js -->
      <g transform="translate(464, 0)">
        <animateTransform attributeName="transform" type="translate" values="464,0; 464,-3; 464,0" dur="4.1s" begin="0.7s" repeatCount="indefinite"/>
        <rect width="120" height="36" rx="8" fill="#0b1633" stroke="#16a34a" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="60" y="23" class="chip-text" fill="#86efac" text-anchor="middle">🟩 NODE.JS</text>
      </g>
      <!-- REST APIs -->
      <g transform="translate(592, 0)">
        <animateTransform attributeName="transform" type="translate" values="592,0; 592,-3; 592,0" dur="4.4s" begin="0.9s" repeatCount="indefinite"/>
        <rect width="125" height="36" rx="8" fill="#0b1633" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="62" y="23" class="chip-text" fill="#c4b5fd" text-anchor="middle">🔌 REST APIS</text>
      </g>
    </g>

    <!-- ================= ROW 3: AI & INTELLIGENCE ================= -->
    <g transform="translate(28, 162)">
      <!-- Category Box -->
      <rect width="115" height="36" rx="8" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.45" stroke-width="1"/>
      <text x="57" y="23" class="cat-label" fill="#f472b6" text-anchor="middle">🤖 AI &amp; ML</text>

      <!-- Prompt Eng -->
      <g transform="translate(125, 0)">
        <animateTransform attributeName="transform" type="translate" values="125,0; 125,-3; 125,0" dur="3.1s" begin="0.15s" repeatCount="indefinite"/>
        <rect width="165" height="36" rx="8" fill="#0b1633" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="82" y="23" class="chip-text" fill="#f9a8d4" text-anchor="middle">🤖 PROMPT ENGINEERING</text>
      </g>
      <!-- ML Basics -->
      <g transform="translate(298, 0)">
        <animateTransform attributeName="transform" type="translate" values="298,0; 298,-3; 298,0" dur="3.4s" begin="0.35s" repeatCount="indefinite"/>
        <rect width="155" height="36" rx="8" fill="#0b1633" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="77" y="23" class="chip-text" fill="#d8b4fe" text-anchor="middle">🧠 MACHINE LEARNING</text>
      </g>
      <!-- NumPy -->
      <g transform="translate(461, 0)">
        <animateTransform attributeName="transform" type="translate" values="461,0; 461,-3; 461,0" dur="3.7s" begin="0.55s" repeatCount="indefinite"/>
        <rect width="110" height="36" rx="8" fill="#0b1633" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="55" y="23" class="chip-text" fill="#c4b5fd" text-anchor="middle">📊 NUMPY</text>
      </g>
      <!-- SciKit-Learn -->
      <g transform="translate(579, 0)">
        <animateTransform attributeName="transform" type="translate" values="579,0; 579,-3; 579,0" dur="4.0s" begin="0.75s" repeatCount="indefinite"/>
        <rect width="138" height="36" rx="8" fill="#0b1633" stroke="#d946ef" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="69" y="23" class="chip-text" fill="#f0abfc" text-anchor="middle">🔬 SCIKIT-LEARN</text>
      </g>
    </g>

    <!-- ================= ROW 4: DEVOPS & TOOLS ================= -->
    <g transform="translate(28, 212)">
      <!-- Category Box -->
      <rect width="115" height="36" rx="8" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.45" stroke-width="1"/>
      <text x="57" y="23" class="cat-label" fill="#fb923c" text-anchor="middle">🛠️ DEVOPS</text>

      <!-- Git -->
      <g transform="translate(125, 0)">
        <animateTransform attributeName="transform" type="translate" values="125,0; 125,-3; 125,0" dur="3.3s" begin="0.2s" repeatCount="indefinite"/>
        <rect width="85" height="36" rx="8" fill="#0b1633" stroke="#f97316" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="42" y="23" class="chip-text" fill="#fdba74" text-anchor="middle">🔥 GIT</text>
      </g>
      <!-- Linux -->
      <g transform="translate(218, 0)">
        <animateTransform attributeName="transform" type="translate" values="218,0; 218,-3; 218,0" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
        <rect width="105" height="36" rx="8" fill="#0b1633" stroke="#eab308" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="52" y="23" class="chip-text" fill="#fde047" text-anchor="middle">🐧 LINUX</text>
      </g>
      <!-- VS Code -->
      <g transform="translate(331, 0)">
        <animateTransform attributeName="transform" type="translate" values="331,0; 331,-3; 331,0" dur="3.9s" begin="0.6s" repeatCount="indefinite"/>
        <rect width="125" height="36" rx="8" fill="#0b1633" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="62" y="23" class="chip-text" fill="#7dd3fc" text-anchor="middle">💻 VS CODE</text>
      </g>
      <!-- GitHub -->
      <g transform="translate(464, 0)">
        <animateTransform attributeName="transform" type="translate" values="464,0; 464,-3; 464,0" dur="4.2s" begin="0.8s" repeatCount="indefinite"/>
        <rect width="115" height="36" rx="8" fill="#0b1633" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="57" y="23" class="chip-text" fill="#cbd5e1" text-anchor="middle">🐙 GITHUB</text>
      </g>
      <!-- Cyber Tools -->
      <g transform="translate(587, 0)">
        <animateTransform attributeName="transform" type="translate" values="587,0; 587,-3; 587,0" dur="4.5s" begin="1.0s" repeatCount="indefinite"/>
        <rect width="130" height="36" rx="8" fill="#0b1633" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
        <text x="65" y="23" class="chip-text" fill="#6ee7b7" text-anchor="middle">🛡️ SEC-TOOLS</text>
      </g>
    </g>

  </g>
</svg>
