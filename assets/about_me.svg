<svg width="850" height="260" viewBox="0 0 850 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .card-lead {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .card-body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-size: 12px;
        font-weight: 400;
      }
    </style>

    <linearGradient id="ab-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813"/>
      <stop offset="50%" stop-color="#090f24"/>
      <stop offset="100%" stop-color="#120822"/>
    </linearGradient>

    <filter id="ab-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="ab-clip">
      <rect width="850" height="260" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ab-clip)">
    <!-- Base -->
    <rect width="850" height="260" fill="url(#ab-bg)"/>

    <!-- Ambient Blobs -->
    <circle cx="80" cy="200" r="120" fill="#00f2fe" fill-opacity="0.08" filter="url(#ab-glow)"/>
    <circle cx="760" cy="50" r="140" fill="#f72585" fill-opacity="0.08" filter="url(#ab-glow)"/>

    <!-- Border -->
    <rect width="850" height="260" rx="16" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.2"/>

    <!-- ================= LEFT COLUMN ================= -->
    <g transform="translate(24, 20)">
      <rect width="80" height="20" rx="5" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-opacity="0.4"/>
      <text x="40" y="14" class="tag-text" fill="#00f2fe" text-anchor="middle">PROFILE</text>

      <text x="0" y="52" class="title-text" fill="#ffffff">💫 ABOUT ME</text>

      <!-- Rotating Hologram Sphere -->
      <g transform="translate(68, 140)">
        <circle cx="0" cy="0" r="44" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="10, 6" opacity="0.8">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="36" fill="none" stroke="#f72585" stroke-width="1.2" stroke-dasharray="6, 5" opacity="0.85">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="0" cy="0" r="28" fill="#0b132b" stroke="#38bdf8" stroke-width="1.8" filter="url(#ab-glow)">
          <animate attributeName="r" values="26;30;26" dur="3s" repeatCount="indefinite"/>
        </circle>
        <text x="0" y="9" font-size="24" text-anchor="middle">🧑‍💻</text>
      </g>
    </g>

    <!-- Separator -->
    <line x1="180" y1="16" x2="180" y2="244" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="4, 4"/>

    <!-- ================= RIGHT COLUMN ================= -->
    <g transform="translate(195, 14)">
      
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <animateTransform attributeName="transform" type="translate" values="0,0; 3,0; 0,0" dur="3s" repeatCount="indefinite"/>
        <rect width="630" height="32" rx="7" fill="#081026" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
        <rect width="3.5" height="32" rx="1.5" fill="#00f2fe"/>
        <text x="14" y="21" font-size="14">💻</text>
        <text x="36" y="21" class="card-lead" fill="#00f2fe">EXPLORING</text>
        <text x="110" y="21" class="card-body" fill="#cbd5e1">Computer Science, Programming &amp; Software Development</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 39)">
        <animateTransform attributeName="transform" type="translate" values="0,39; 3,39; 0,39" dur="3.4s" begin="0.2s" repeatCount="indefinite"/>
        <rect width="630" height="32" rx="7" fill="#081026" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
        <rect width="3.5" height="32" rx="1.5" fill="#38bdf8"/>
        <text x="14" y="21" font-size="14">🤖</text>
        <text x="36" y="21" class="card-lead" fill="#38bdf8">ASPIRING</text>
        <text x="100" y="21" class="card-body" fill="#cbd5e1">Artificial Intelligence &amp; Neural Network Architectures</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 78)">
        <animateTransform attributeName="transform" type="translate" values="0,78; 3,78; 0,78" dur="3.8s" begin="0.4s" repeatCount="indefinite"/>
        <rect width="630" height="32" rx="7" fill="#081026" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1"/>
        <rect width="3.5" height="32" rx="1.5" fill="#818cf8"/>
        <text x="14" y="21" font-size="14">🛡️</text>
        <text x="36" y="21" class="card-lead" fill="#a5b4fc">SECURITY</text>
        <text x="100" y="21" class="card-body" fill="#cbd5e1">Cybersecurity Engineer &amp; Defensive Sec-Ops Practices</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 117)">
        <animateTransform attributeName="transform" type="translate" values="0,117; 3,117; 0,117" dur="4.2s" begin="0.6s" repeatCount="indefinite"/>
        <rect width="630" height="32" rx="7" fill="#081026" fill-opacity="0.85" stroke="#9d4edd" stroke-opacity="0.25" stroke-width="1"/>
        <rect width="3.5" height="32" rx="1.5" fill="#9d4edd"/>
        <text x="14" y="21" font-size="14">🚀</text>
        <text x="36" y="21" class="card-lead" fill="#c4b5fd">MISSION</text>
        <text x="96" y="21" class="card-body" fill="#cbd5e1">Turning complex ideas into scalable, real-world solutions</text>
      </g>

      <!-- Row 5 -->
      <g transform="translate(0, 156)">
        <animateTransform attributeName="transform" type="translate" values="0,156; 3,156; 0,156" dur="4.6s" begin="0.8s" repeatCount="indefinite"/>
        <rect width="630" height="32" rx="7" fill="#081026" fill-opacity="0.85" stroke="#f72585" stroke-opacity="0.25" stroke-width="1"/>
        <rect width="3.5" height="32" rx="1.5" fill="#f72585"/>
        <text x="14" y="21" font-size="14">🧠</text>
        <text x="36" y="21" class="card-lead" fill="#f472b6">METHOD</text>
        <text x="96" y="21" class="card-body" fill="#fbcfe8">Build ➔ Experiment ➔ Debug ➔ Refine ➔ Deploy</text>
      </g>

      <!-- Row 6 -->
      <g transform="translate(0, 195)">
        <animateTransform attributeName="transform" type="translate" values="0,195; 3,195; 0,195" dur="5.0s" begin="1.0s" repeatCount="indefinite"/>
        <rect width="630" height="32" rx="7" fill="#081026" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
        <rect width="3.5" height="32" rx="1.5" fill="#10b981"/>
        <text x="14" y="21" font-size="14">🌱</text>
        <text x="36" y="21" class="card-lead" fill="#34d399">FOCUS</text>
        <text x="88" y="21" class="card-body" fill="#cbd5e1">Strengthening CSE fundamentals, Core AI &amp; Cybersecurity skills</text>
      </g>

    </g>
  </g>
</svg>
