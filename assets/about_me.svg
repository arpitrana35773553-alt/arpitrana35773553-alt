<svg width="850" height="246" viewBox="0 0 850 246" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c18"/><stop offset="100%" stop-color="#0f1627"/>
    </linearGradient>
    <radialGradient id="ab1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity=".25"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ab2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity=".18"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="ag" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="850" height="246" rx="20" fill="url(#abg)"/>
  <rect width="850" height="246" rx="20" fill="none" stroke="#6366f1" stroke-opacity=".22" stroke-width="1"/>

  <!-- Blobs -->
  <ellipse cx="840" cy="-30" rx="160" ry="160" fill="url(#ab1)">
    <animate attributeName="opacity" values=".4;.9;.4" dur="5s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="100" cy="290" rx="130" ry="130" fill="url(#ab2)">
    <animate attributeName="opacity" values=".3;.7;.3" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- LEFT -->
  <line x1="28" y1="28" x2="60" y2="28" stroke="#38bdf8" stroke-width="1" stroke-opacity=".6"/>
  <text x="66" y="33" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1.2">ABOUT ME</text>
  <text x="28" y="76" font-family="'Segoe UI',system-ui,sans-serif" font-size="25" font-weight="800" fill="#f1f5f9">💫 Who Am I</text>

  <!-- Avatar ring -->
  <circle cx="100" cy="174" r="38" fill="url(#aring)" filter="url(#ag)" opacity=".55">
    <animate attributeName="r" values="36;40;36" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".4;.7;.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="174" r="34" fill="none" stroke="url(#aring)" stroke-width="2.5">
    <animate attributeName="r" values="33;36;33" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="174" r="28" fill="#0f1830"/>
  <text x="100" y="183" font-size="26" text-anchor="middle">🧑‍💻</text>

  <line x1="220" y1="14" x2="220" y2="232" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>

  <!-- RIGHT — 6 items -->
  <!-- Item 1 -->
  <rect x="236" y="16" width="598" height="28" rx="9" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".06" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".10s" fill="freeze"/>
  </rect>
  <text x="252" y="35" font-size="15" opacity="0">💻<animate attributeName="opacity" values="0;1" dur=".5s" begin=".10s" fill="freeze"/></text>
  <text x="274" y="35" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#cbd5e1" opacity="0">
    Exploring <tspan font-weight="700" fill="#38bdf8">Computer Science, Programming &amp; Software Dev</tspan>
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".10s" fill="freeze"/>
  </text>

  <!-- Item 2 -->
  <rect x="236" y="52" width="598" height="28" rx="9" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".06" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".20s" fill="freeze"/>
  </rect>
  <text x="252" y="71" font-size="15" opacity="0">🤖<animate attributeName="opacity" values="0;1" dur=".5s" begin=".20s" fill="freeze"/></text>
  <text x="274" y="71" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#cbd5e1" opacity="0">
    Aspiring <tspan font-weight="700" fill="#38bdf8">AI Enthusiast</tspan> — diving into ML &amp; neural networks
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".20s" fill="freeze"/>
  </text>

  <!-- Item 3 -->
  <rect x="236" y="88" width="598" height="28" rx="9" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".06" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".30s" fill="freeze"/>
  </rect>
  <text x="252" y="107" font-size="15" opacity="0">🛡️<animate attributeName="opacity" values="0;1" dur=".5s" begin=".30s" fill="freeze"/></text>
  <text x="274" y="107" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#cbd5e1" opacity="0">
    Working toward becoming a <tspan font-weight="700" fill="#c084fc">Cybersecurity Engineer</tspan>
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".30s" fill="freeze"/>
  </text>

  <!-- Item 4 -->
  <rect x="236" y="124" width="598" height="28" rx="9" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".06" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".40s" fill="freeze"/>
  </rect>
  <text x="252" y="143" font-size="15" opacity="0">🚀<animate attributeName="opacity" values="0;1" dur=".5s" begin=".40s" fill="freeze"/></text>
  <text x="274" y="143" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#cbd5e1" opacity="0">
    Building projects to turn <tspan font-weight="700" fill="#38bdf8">ideas into practical solutions</tspan>
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".40s" fill="freeze"/>
  </text>

  <!-- Item 5 -->
  <rect x="236" y="160" width="598" height="28" rx="9" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".06" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".50s" fill="freeze"/>
  </rect>
  <text x="252" y="179" font-size="15" opacity="0">🧠<animate attributeName="opacity" values="0;1" dur=".5s" begin=".50s" fill="freeze"/></text>
  <text x="274" y="179" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#cbd5e1" opacity="0">
    Learning by <tspan font-weight="600" fill="#c084fc">building → experimenting → debugging → refining</tspan>
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".50s" fill="freeze"/>
  </text>

  <!-- Item 6 -->
  <rect x="236" y="196" width="598" height="28" rx="9" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".06" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".60s" fill="freeze"/>
  </rect>
  <text x="252" y="215" font-size="15" opacity="0">🌱<animate attributeName="opacity" values="0;1" dur=".5s" begin=".60s" fill="freeze"/></text>
  <text x="274" y="215" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#cbd5e1" opacity="0">
    Strengthening <tspan font-weight="700" fill="#38bdf8">CSE fundamentals</tspan>, AI &amp; Cybersecurity skills
    <animate attributeName="opacity" values="0;1" dur=".5s" begin=".60s" fill="freeze"/>
